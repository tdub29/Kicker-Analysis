# Install from a checkout, editable:
#
#     pip install -e .            # or  pip install -e ".[dev]"  for pytest
#
# Editable is the only supported mode. Every module finds data/ and reports/
# relative to its own file (ROOT = parents[2]), which is the checkout only when
# the package is not copied into site-packages.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kicker-analysis"
version = "0.1.0"
description = "Weekly NFL kicker fantasy forecasts with season-forward backtests."
readme = "README.md"
authors = [{ name = "Trevor White" }]
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Repository = "https://github.com/tdub29/Kicker-Analysis"

[tool.setuptools.dynamic]
# One list, in requirements.txt, so the two install paths cannot drift.
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]
include = ["kicker_analysis"]
